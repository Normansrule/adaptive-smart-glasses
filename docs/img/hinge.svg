<text x="708" y="155" font-size="16" font-weight="700" fill="#14181d">Flared tube top: holds the temple on</text>
<polyline points="300.5,345 680,260 700,260" fill="none" stroke="#ff4d3d" stroke-width="2"/><circle cx="300.5" cy="345" r="5" fill="#ff4d3d"/>
<text x="708" y="265" font-size="16" font-weight="700" fill="#14181d">Frame knuckle: bore 4.35 mm, tube turns</text>
<polyline points="274.0,395.0 680,380 700,380" fill="none" stroke="#ff4d3d" stroke-width="2"/><circle cx="274.0" cy="395.0" r="5" fill="#ff4d3d"/>
<text x="708" y="385" font-size="16" font-weight="700" fill="#14181d">Brass tube 4 mm OD / 3.1 mm ID, 13.5 mm long</text>
<polyline points="372.5,520 680,500 700,500" fill="none" stroke="#ff4d3d" stroke-width="2"/><circle cx="372.5" cy="520" r="5" fill="#ff4d3d"/>
<text x="708" y="505" font-size="16" font-weight="700" fill="#14181d">Temple knuckle: bore 4.05 mm, tube glued (CA)</text>
<polyline points="492.5,577.5 680,600 700,600" fill="none" stroke="#ff4d3d" stroke-width="2"/><circle cx="492.5" cy="577.5" r="5" fill="#ff4d3d"/>
<text x="708" y="605" font-size="16" font-weight="700" fill="#14181d">Wire chamber, then groove on the temple's head side</text>
<text x="42.5" y="193.0" font-size="14" fill="#5d6773">from the frame groove</text>
<text x="42.5" y="474.0" font-size="15" font-weight="700" fill="#2c3e50">FRAME</text>
